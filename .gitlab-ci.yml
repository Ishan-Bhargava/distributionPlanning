# Builds the OptiFlow Streamlit UI and deploys it to an AWS Lightsail Container
# Service - no EC2, no long-lived AWS keys in GitLab. Authentication to AWS is
# via OIDC federation (sts:AssumeRoleWithWebIdentity): GitLab hands this job a
# short-lived, pipeline-scoped identity token, and AWS exchanges it for
# temporary credentials through an IAM role trust policy. See streamlit/README.md
# for the one-time AWS + GitLab setup this pipeline assumes already exists.

stages:
  - deploy

deploy:
  stage: deploy
  image: docker:26-cli
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  id_tokens:
    AWS_ID_TOKEN:
      # Must match the audience configured on the AWS IAM OIDC identity
      # provider. For gitlab.com this is https://gitlab.com; for a
      # self-managed instance, use that instance's own URL instead.
      aud: https://gitlab.com
  before_script:
    - apk add --no-cache python3 py3-pip jq curl
    - pip3 install --break-system-packages --quiet awscli
    - curl -sSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o /usr/local/bin/lightsailctl
    - chmod +x /usr/local/bin/lightsailctl
    - >
      CREDS=$(aws sts assume-role-with-web-identity
        --role-arn "$AWS_ROLE_ARN"
        --role-session-name "gitlab-ci-$CI_PIPELINE_ID"
        --web-identity-token "$AWS_ID_TOKEN"
        --duration-seconds 3600
        --query 'Credentials' --output json)
    - export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .AccessKeyId)
    - export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .SecretAccessKey)
    - export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .SessionToken)
    - export AWS_DEFAULT_REGION="$AWS_REGION"
  script:
    # 1. build the image in the dind daemon this job is talking to
    - docker build -t "optiflow-streamlit:$CI_COMMIT_SHORT_SHA" .

    # 2. hand it to Lightsail's own private registry (no ECR needed for
    #    Lightsail Containers - push-container-image IS the registry push)
    - >
      PUSH_OUT=$(aws lightsail push-container-image
        --region "$AWS_REGION"
        --service-name "$LIGHTSAIL_SERVICE_NAME"
        --label app
        --image "optiflow-streamlit:$CI_COMMIT_SHORT_SHA")
    - echo "$PUSH_OUT"
    - IMAGE_REF=$(echo "$PUSH_OUT" | grep -oE ':[A-Za-z0-9_.-]+\.app\.[0-9]+' | tail -1)
    - test -n "$IMAGE_REF" || (echo "could not parse pushed image reference" && exit 1)

    # 3. write the container + deployment spec (secrets injected as env vars,
    #    never baked into the image or committed to the repo)
    - python3 deploy/make_containers_json.py "$IMAGE_REF" containers.json

    # 4. roll out the new deployment
    - >
      aws lightsail create-container-service-deployment
        --region "$AWS_REGION"
        --service-name "$LIGHTSAIL_SERVICE_NAME"
        --containers file://containers.json
        --public-endpoint file://deploy/public-endpoint.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
